<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — VeilBrowser</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth.js"></script>
</head>
<body>
<div class="fx-bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div></div>

<nav>
  <div class="wrap nav-in">
    <a class="brand" href="index.html"><img src="assets/logo.png" alt="VeilBrowser logo"><span>Veil<em>Browser</em></span></a>
    <div class="nav-right" id="nav-auth"></div>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <h2>Set a new password</h2>
    <p class="sub">Naya password likhein — website aur app, dono ke liye yehi chalega.</p>
    <form id="reset-form">
      <label for="pw">New password</label>
      <input type="password" id="pw" placeholder="New password" required minlength="6" autocomplete="new-password">
      <button class="btn btn-grad" type="submit" id="reset-btn">Save new password</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="link-row"><a href="auth.html">Back to login</a></div>
  </div>
</div>

<script>
(function () {
  var msg = document.getElementById("msg");
  function show(t, ok) { msg.textContent = t; msg.className = "msg " + (ok ? "ok" : "err"); }
  document.getElementById("reset-form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (!window.VB || !window.VB.configured) { show("Login system abhi setup ho raha hai.", false); return; }
    var pw = document.getElementById("pw").value;
    var btn = document.getElementById("reset-btn");
    btn.disabled = true; btn.textContent = "Please wait...";
    window.VB.updatePassword(pw).then(function (r) {
      btn.disabled = false; btn.textContent = "Save new password";
      if (r.error) { show(r.error.message, false); return; }
      show("Password badal gaya! Ab naye password se login karein.", true);
      setTimeout(function () { window.location.href = "dashboard.html"; }, 1200);
    });
  });
})();
</script>
<script src="assets/fx.js"></script>
</body>
</html>
